<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
  <meta name="theme-color" content="#071f52">
  <meta name="description" content="Brochure digitale sfogliabile de L'Officina del Talento SVT – ASD • APS">
  <title>L'Officina del Talento SVT — Brochure</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='16' width='64' height='64' fill='%23071f52'/%3E%3Cpath d='M13 18l19 8 19-8v29l-19 8-19-8z' fill='%23fff'/%3E%3Cpath d='M32 26v29M16 21l16 6 16-6' stroke='%23ff6b18' stroke-width='4' fill='none'/%3E%3C/svg%3E">
  <style>
    :root{--navy:#071f52;--blue:#0c4fad;--orange:#f15a24;--paper:#fff;--ink:#0c1c3e}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{overflow:hidden;background:radial-gradient(circle at 50% 18%,#204b88 0,#0c2e64 38%,#051936 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
    button{font:inherit}
    .app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:max(10px,env(safe-area-inset-top)) clamp(10px,2vw,28px) max(12px,env(safe-area-inset-bottom));gap:12px}
    .topbar,.toolbar{display:flex;align-items:center;justify-content:center;gap:10px;position:relative;z-index:100}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brand-mark{width:34px;height:34px;border-radius:10px;background:white;display:grid;place-items:center;box-shadow:0 6px 20px #0004}
    .brand-mark svg{width:25px;height:25px}
    .brand-text{line-height:1.1;min-width:0}
    .brand-text strong{display:block;font-size:clamp(.82rem,1.8vw,1.02rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brand-text span{display:block;font-size:.73rem;color:#d9e7ff;margin-top:3px}
    .book-shell{min-height:0;display:grid;place-items:center;perspective:2400px;position:relative;touch-action:none;overflow:hidden}
    .book{height:min(78vh,calc(100vw * .705));aspect-ratio:1.333/1;position:relative;transform-style:preserve-3d;filter:drop-shadow(0 30px 30px #0007);transform-origin:center;transition:transform .18s ease}
    .book:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;z-index:60;background:linear-gradient(#0000,#0008 8%,#0008 92%,#0000);box-shadow:0 0 15px #0009;pointer-events:none}
    .sheet{position:absolute;width:50%;height:100%;left:50%;top:0;transform-style:preserve-3d;transform-origin:left center;transition:transform .92s cubic-bezier(.2,.62,.22,1);will-change:transform}
    .sheet.flipped{transform:rotateY(-180deg)}
    .face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;overflow:hidden;box-shadow:inset 0 0 18px #0010341f}
    .front{border-radius:0 7px 7px 0}
    .back{transform:rotateY(180deg);border-radius:7px 0 0 7px}
    .face img{width:100%;height:100%;object-fit:contain;display:block;background:white;user-select:none;-webkit-user-drag:none}
    .face:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#00184222,transparent 7%,transparent 89%,#00184212)}
    .sheet.flipping .front:after,.sheet.flipping .back:after{background:linear-gradient(90deg,#00184244,transparent 30%,#fff4 58%,#00184255)}
    .mobile-book{display:none;height:min(76vh,calc(92vw * 1.5));aspect-ratio:2/3;position:relative;perspective:1600px;filter:drop-shadow(0 24px 28px #0008);transform-origin:center;transition:transform .18s ease}
    .mobile-page{position:absolute;inset:0;background:#fff;border-radius:8px;overflow:hidden;transform-origin:left center;transition:opacity .85s ease;backface-visibility:hidden}
    .mobile-page img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
    .mobile-page.past{transform:none;opacity:0;pointer-events:none}
    .mobile-page.active{transform:rotateY(0);opacity:1}
    .mobile-page.future{transform:rotateY(0);opacity:0;pointer-events:none}
    .nav-zone{position:absolute;top:0;bottom:0;width:24%;z-index:80;border:0;background:transparent;cursor:pointer;color:transparent}
    .nav-zone.prev{left:0}.nav-zone.next{right:0}
    .zoom-controls{position:absolute;right:clamp(4px,1.2vw,16px);top:50%;transform:translateY(-50%);z-index:110;display:flex;flex-direction:column;align-items:center;gap:7px}
    .zoom-button{width:44px;height:44px;border:1px solid #ffffff40;border-radius:50%;background:#071f52d9;color:#fff;display:grid;place-items:center;font-size:1.55rem;font-weight:700;cursor:pointer;box-shadow:0 6px 18px #00102a80;backdrop-filter:blur(10px)}
    .zoom-button:hover{background:#0c4fad}.zoom-button:disabled{opacity:.38;cursor:default}
    .zoom-button.zoom-value{height:36px;width:56px;border-radius:999px;font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums}
    .book.zoom-drag,.mobile-book.zoom-drag{transition:none;cursor:grabbing}
    .control{height:42px;min-width:42px;padding:0 13px;border:1px solid #ffffff30;border-radius:999px;background:#ffffff14;color:white;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;backdrop-filter:blur(12px);box-shadow:0 5px 15px #00102a50;transition:.2s ease}
    .control:hover{background:#ffffff25;transform:translateY(-1px)}
    .control:active{transform:translateY(1px)}
    .control:disabled{opacity:.35;cursor:default;transform:none}
    .control svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .count{font-variant-numeric:tabular-nums;min-width:78px;text-align:center;color:#eaf2ff;font-size:.88rem}
    .hint{font-size:.75rem;color:#c9daf6;text-align:center;opacity:.85;position:absolute;right:0}
    .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:760px){
      .app{gap:8px}.book{display:none}.mobile-book{display:block}.brand-text span{display:none}.hint{display:none}
      .toolbar{gap:8px}.control{height:40px;min-width:40px;padding:0 11px}.control .label{display:none}
      .zoom-controls{right:3px}.zoom-button{width:40px;height:40px}.zoom-button.zoom-value{width:50px;height:34px;font-size:.68rem}
    }
    @media(prefers-reduced-motion:reduce){.sheet,.mobile-page,.control{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><img src="assets/logo-ufficiale.webp" alt="Logo ufficiale" style="width:32px;height:32px;object-fit:contain"></div>
        <div class="brand-text"><strong>L’Officina del Talento SVT</strong><span>Progetto e donazioni · ASD • APS</span></div>
      </div>
      <div class="hint">Tocca un lato o scorri per sfogliare</div>
    </header>

    <section class="book-shell" id="reader" aria-label="Brochure sfogliabile">
      <div class="book" id="desktopBook"></div>
      <div class="mobile-book" id="mobileBook"></div>
      <button class="nav-zone prev" id="tapPrev" aria-label="Pagina precedente">Precedente</button>
      <button class="nav-zone next" id="tapNext" aria-label="Pagina successiva">Successiva</button>
      <div class="zoom-controls" aria-label="Comandi di ingrandimento">
        <button class="zoom-button" id="zoomIn" aria-label="Ingrandisci" title="Ingrandisci">+</button>
        <button class="zoom-button zoom-value" id="zoomReset" aria-label="Ripristina dimensione" title="Torna al 100%"><span id="zoomValue">100%</span></button>
        <button class="zoom-button" id="zoomOut" aria-label="Riduci" title="Riduci">−</button>
      </div>
      <div class="sr" aria-live="polite" id="announcer"></div>
    </section>

    <nav class="toolbar" aria-label="Comandi brochure">
      <button class="control" id="prev" aria-label="Pagina precedente"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg><span class="label">Indietro</span></button>
      <div class="count" id="count">1 / 8</div>
      <button class="control" id="next" aria-label="Pagina successiva"><span class="label">Avanti</span><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="control" id="sound" aria-label="Disattiva suono" title="Suono"><svg id="soundIcon" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/></svg></button>
      <button class="control" id="full" aria-label="Schermo intero" title="Schermo intero"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
    </nav>
  </main>

  (()=>{
    const pages=["assets/brochure-1.webp", "assets/brochure-2.webp", "assets/brochure-3.webp", "assets/brochure-4.webp", "assets/brochure-5.webp", "assets/brochure-6.webp", "assets/brochure-7.webp", "assets/brochure-8.webp"];
    const desktop=document.getElementById('desktopBook');
    const mobile=document.getElementById('mobileBook');
    const count=document.getElementById('count');
    const announce=document.getElementById('announcer');
    const audio=document.getElementById('flipAudio');
    const btnPrev=document.getElementById('prev'),btnNext=document.getElementById('next');
    const tapPrev=document.getElementById('tapPrev'),tapNext=document.getElementById('tapNext');
    const soundBtn=document.getElementById('sound'),soundIcon=document.getElementById('soundIcon');
    const zoomInBtn=document.getElementById('zoomIn'),zoomOutBtn=document.getElementById('zoomOut'),zoomResetBtn=document.getElementById('zoomReset'),zoomValue=document.getElementById('zoomValue');
    let page=0,soundOn=true,busy=false,startX=0,startY=0,zoom=1,panX=0,panY=0;
    const pointers=new Map();let dragStartX=0,dragStartY=0,pinchStartDistance=0,pinchStartZoom=1,gesturePinching=false;
    const sheets=[];
    for(let i=0;i<pages.length;i+=2){
      const sheet=document.createElement('div');sheet.className='sheet';sheet.style.zIndex=String(30-i);
      sheet.innerHTML=`<div class="face front"><img src="${pages[i]}" alt="Pagina ${i+1}" draggable="false"></div><div class="face back"><img src="${pages[i+1]}" alt="Pagina ${i+2}" draggable="false"></div>`;
      desktop.appendChild(sheet);sheets.push(sheet);
    }
    const mobilePages=pages.map((src,i)=>{const el=document.createElement('div');el.className='mobile-page';el.style.zIndex=String(pages.length-i);el.innerHTML=`<img src="${src}" alt="Pagina ${i+1}" draggable="false">`;mobile.appendChild(el);return el});
    function activeBook(){return innerWidth>760?desktop:mobile}
    function clampPan(){
      const book=activeBook(),maxX=Math.max(0,book.offsetWidth*(zoom-1)/2),maxY=Math.max(0,book.offsetHeight*(zoom-1)/2);
      panX=Math.max(-maxX,Math.min(maxX,panX));panY=Math.max(-maxY,Math.min(maxY,panY));
    }
    function applyZoom(){
      clampPan();const transform=`translate3d(${panX}px,${panY}px,0) scale(${zoom})`;
      desktop.style.transform=mobile.style.transform=transform;
      zoomValue.textContent=`${Math.round(zoom*100)}%`;zoomOutBtn.disabled=zoom<=1.001;zoomInBtn.disabled=zoom>=3.999;
      tapPrev.style.pointerEvents=tapNext.style.pointerEvents=zoom>1.001?'none':'';
      announce.textContent=zoom>1.001?`Ingrandimento ${Math.round(zoom*100)} per cento`:`Dimensione normale`;
    }
    function setZoom(value){zoom=Math.max(1,Math.min(4,value));if(zoom<=1.001){zoom=1;panX=panY=0}applyZoom()}
    zoomInBtn.onclick=()=>setZoom(zoom+.25);zoomOutBtn.onclick=()=>setZoom(zoom-.25);zoomResetBtn.onclick=()=>setZoom(1);
    function play(){if(!soundOn)return;audio.currentTime=0;audio.volume=.42;audio.play().catch(()=>{})}
    function render(){
      sheets.forEach((s,i)=>{const flipped=page>i*2;s.classList.toggle('flipped',flipped);s.style.zIndex=String(flipped?10+i:30-i)});
      mobilePages.forEach((p,i)=>p.className='mobile-page '+(i<page?'past':i===page?'active':'future'));
      const desktopMode=innerWidth>760;
      count.textContent=desktopMode&&page>0&&page<pages.length-1?`${page+1}–${page+2} / ${pages.length}`:`${page+1} / ${pages.length}`;
      btnPrev.disabled=tapPrev.disabled=page===0;btnNext.disabled=tapNext.disabled=page===pages.length-1;
      announce.textContent=`Pagina ${page+1} di ${pages.length}`;
    }
    function go(delta){
      if(busy)return;const target=Math.max(0,Math.min(pages.length-1,page+delta));if(target===page)return;
      setZoom(1);
      const desktopMode=innerWidth>760;
      const step=desktopMode?(delta>0?(page===0?1:2):(page===pages.length-1?2:2)):1;
      const destination=Math.max(0,Math.min(pages.length-1,page+(delta>0?step:-step)));
      const sheet=sheets[Math.floor((delta>0?page:destination)/2)];
      busy=true;if(sheet)sheet.classList.add('flipping');play();page=destination;render();
      setTimeout(()=>{if(sheet)sheet.classList.remove('flipping');busy=false},940);
    }
    btnPrev.onclick=tapPrev.onclick=()=>go(-1);btnNext.onclick=tapNext.onclick=()=>go(1);
    document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1);if(e.key==='Home'){setZoom(1);page=0;render()}if(e.key==='End'){setZoom(1);page=pages.length-1;render()}if(e.key==='+'||e.key==='=')setZoom(zoom+.25);if(e.key==='-')setZoom(zoom-.25);if(e.key==='0')setZoom(1)});
    const reader=document.getElementById('reader');
    reader.addEventListener('pointerdown',e=>{
      if(e.target.closest('.zoom-controls'))return;
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});reader.setPointerCapture?.(e.pointerId);
      if(pointers.size===1){startX=e.clientX;startY=e.clientY;dragStartX=panX;dragStartY=panY;if(zoom>1)activeBook().classList.add('zoom-drag')}
      if(pointers.size===2){const p=[...pointers.values()];pinchStartDistance=Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y);pinchStartZoom=zoom;gesturePinching=true}
    });
    reader.addEventListener('pointermove',e=>{
      if(!pointers.has(e.pointerId))return;e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pointers.size===2){const p=[...pointers.values()],distance=Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y);if(pinchStartDistance>0)setZoom(pinchStartZoom*distance/pinchStartDistance)}
      else if(pointers.size===1&&zoom>1){panX=dragStartX+(e.clientX-startX);panY=dragStartY+(e.clientY-startY);applyZoom()}
    },{passive:false});
    function endPointer(e){
      if(!pointers.has(e.pointerId))return;const dx=e.clientX-startX,dy=e.clientY-startY;pointers.delete(e.pointerId);desktop.classList.remove('zoom-drag');mobile.classList.remove('zoom-drag');
      if(!gesturePinching&&zoom===1&&Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2)go(dx<0?1:-1);
      if(pointers.size===1){const p=[...pointers.values()][0];startX=p.x;startY=p.y;dragStartX=panX;dragStartY=panY;if(zoom>1)activeBook().classList.add('zoom-drag')}
      if(pointers.size===0)gesturePinching=false;
    }
    reader.addEventListener('pointerup',endPointer);reader.addEventListener('pointercancel',endPointer);
    reader.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();setZoom(zoom+(e.deltaY<0?.25:-.25))},{passive:false});
    soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.setAttribute('aria-label',soundOn?'Disattiva suono':'Attiva suono');soundIcon.innerHTML=soundOn?'<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/>':'<path d="M11 5 6 9H2v6h4l5 4z"/><path d="m16 9 5 5m0-5-5 5"/>'};
    document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
    addEventListener('resize',()=>{render();applyZoom()},{passive:true});
    render();applyZoom();
  })();
  </script>
</body>
</html>
