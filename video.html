<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071f52">
<title>Il video del progetto — L’Officina del Talento SVT</title>
<meta name="description" content="Guarda il video di presentazione dell’Officina del Talento SVT e torna alla home per conoscere il progetto.">
<style>
*{box-sizing:border-box}body{margin:0;background:#fffaf2;color:#071f52;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
header,main{width:min(100%,1000px);margin:auto;padding:24px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}.brand img{width:64px;height:64px;object-fit:contain}.brand strong,.brand small{display:block}.brand strong{line-height:1.3}.brand small{font-size:12px}
.home{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;background:#071f52;color:#fff;text-decoration:none;font-weight:750;border-radius:12px}
button:focus-visible,a:focus-visible,video:focus-visible{outline:3px solid #b83b0c;outline-offset:4px}h1{font-size:clamp(28px,5vw,42px);line-height:1.2;margin:0 0 12px}
video{display:block;width:100%;max-height:70vh;background:#000;border-radius:16px;margin-top:24px}
@media(max-width:600px){header,main{padding:18px}header>.home{width:100%}.brand strong{font-size:15px}main{padding-top:12px}}
.video-stage{position:relative;margin-top:24px}.video-stage video{margin-top:0}.sound-start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#071f5270;border-radius:16px}.sound-start[hidden]{display:none}.sound-start button{border:2px solid #fff;border-radius:12px;background:#071f52;color:white;font:750 18px system-ui;padding:18px 24px;min-height:56px;cursor:pointer}
</style>
</head>
<body>
<header><a class="brand" href="index.html"><img src="assets/logo-web.webp" alt="Logo ufficiale"><span><strong>L’Officina del Talento SVT</strong><small>ASD • APS · San Valentino Torio</small></span></a><a class="home" href="index.html">← Torna alla home</a></header>
<main><h1>Il video del nostro progetto</h1><p>Coltiviamo il talento, costruiamo il futuro.</p><div class="video-stage"><video id="project-video" controls playsinline preload="auto" aria-label="Video di presentazione dell’Officina del Talento SVT"><source src="video.mp4?v=fb5b5a2004bb" type="video/mp4">Il tuo browser non supporta il lettore video. <a href="video.mp4?v=fb5b5a2004bb">Apri il video</a>.</video><div class="sound-start" id="sound-start"><button type="button" id="start-video">▶ Avvia con audio</button></div></div><p id="audio-status" role="status"><small>Il video parte con audio. Se l’avvio automatico è bloccato, premi «Avvia con audio» per guardarlo dall’inizio.</small></p></main>
<script>
const video=document.getElementById('project-video'),overlay=document.getElementById('sound-start'),button=document.getElementById('start-video'),status=document.getElementById('audio-status');
video.muted=false;video.defaultMuted=false;video.volume=1;
async function startVideo(){try{video.muted=false;video.volume=1;await video.play();overlay.hidden=true;status.textContent='Audio attivo. Puoi regolare il volume dai controlli del lettore.';}catch{video.pause();if(video.readyState>0)video.currentTime=0;overlay.hidden=false;status.textContent='Premi «Avvia con audio»: il video partirà dall’inizio con il suono attivo.';}}
button.addEventListener('click',startVideo);video.addEventListener('playing',()=>{overlay.hidden=true;});startVideo();
</script>
</body>
</html>
